name: Build GRFs
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: israeli-town-names-english
          path: dist/israeli_town_names_english-*/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: israeli-town-names-bilingual
          path: dist/israeli_town_names_bilingual-*/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: israeli-town-names-hebrew
          path: dist/israeli_town_names_hebrew-*/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: town-names-review
          path: town_names_review.csv
