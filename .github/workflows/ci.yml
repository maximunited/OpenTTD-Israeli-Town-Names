name: Validate and build both GRFs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python make_english.py --amnon
      - run: nmlc -c --grf israeli_town_names_hebrew.grf israel.nml
      - run: nmlc -c --lang-dir lang_english --grf israeli_town_names_english.grf israel_english.nml
      - uses: actions/upload-artifact@v4
        with:
          name: israeli-town-names
          path: |
            israeli_town_names_hebrew.grf
            israeli_town_names_english.grf
            town_names_review.csv
