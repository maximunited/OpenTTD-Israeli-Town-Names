name: Validate and build Hebrew GRF
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: nmlc -c --grf israeli_town_names_hebrew.grf israel.nml
      - uses: actions/upload-artifact@v4
        with:
          name: israeli-town-names-hebrew
          path: israeli_town_names_hebrew.grf
